# Deploy: every push to main (and manual runs) re-runs the full CI and, only if it passes,
# publishes the exact build CI tested to GitHub Pages.
#
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy half-way; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Publish to GitHub Pages
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write    # to deploy to Pages
      id-token: write # to verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the tested build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Site: ${{ steps.deployment.outputs.page_url }}"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Build info: ${{ steps.deployment.outputs.page_url }}version.json"
          } >> "$GITHUB_STEP_SUMMARY"
