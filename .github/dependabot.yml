# Weekly dependency update pull requests. Each one runs CI before you merge it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # three.js and its types move together
      three:
        patterns: ['three', '@types/three']
      tooling:
        patterns: ['vite', 'vitest', 'typescript', 'playwright', '@types/node']
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
